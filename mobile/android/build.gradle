buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Apply Flutter Gradle plugin from Flutter SDK
def flutterRoot = System.getenv('FLUTTER_ROOT') ?: localProperties.getProperty('flutter.sdk')
if (flutterRoot) {
    apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter_plugin_loader.gradle"
}